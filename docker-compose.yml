name: shorty

services:
  shorty:
    build:
      context: .
    image: shorty:latest
    container_name: shorty
    restart: unless-stopped

    # No ports published. The container lives on an internal bridge network and
    # nginx on the host proxies straight to its fixed address.
    environment:
      SHORTY_ADDR: ":8080"
      SHORTY_DB: /data/shorty.db
      SHORTY_BASE_URL: "${SHORTY_BASE_URL:-}"

    volumes:
      # SQLite file lives here: ./data/shorty.db on the host.
      - ./data:/data

    # Rootless: nothing inside the container runs as uid 0. Set PUID/PGID to
    # whoever owns ./data (`id -u`, `id -g`) — see .env.example.
    user: "${PUID:-1000}:${PGID:-1000}"

    # No capabilities, no way to gain any, read-only root filesystem. The only
    # writable paths are the /data volume and a small tmpfs for /tmp.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

    networks:
      shorty:
        ipv4_address: "${SHORTY_IP:-172.31.0.10}"

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  shorty:
    name: shorty
    driver: bridge
    # internal: true means no gateway to the outside. Host -> container still
    # works because that is plain L2 routing over the bridge, so nginx on the
    # host reaches 172.31.0.10:8080 while the container has no route out.
    internal: true
    ipam:
      config:
        - subnet: "${SHORTY_SUBNET:-172.31.0.0/24}"
          gateway: "${SHORTY_GATEWAY:-172.31.0.1}"
